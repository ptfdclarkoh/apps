<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crew Schedule</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* slate-900 */
            background-image: radial-gradient(circle at top left, rgba(79, 70, 229, 0.2), transparent 30%),
                              radial-gradient(circle at bottom right, rgba(139, 92, 246, 0.15), transparent 40%);
            /* CONSTRAINT: No scrollbars globally */
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .schedule-card {
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* Hide scrollbars inside cards if content slightly overflows, keeping clean look */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 text-gray-300">

    <!-- CONSTRAINT: Fixed container size 1670x1080 -->
    <div class="w-full h-full max-w-[1670px] max-h-[1080px] p-6 flex flex-col">
        
        <!-- Header text size remains unchanged as requested -->
        <header class="text-center mb-6 flex-shrink-0">
            <h1 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">
                CREW SCHEDULE
            </h1>
            <p class="mt-1 text-lg text-slate-400">Upcoming Crew Assignments</p>
        </header>

        <!-- CONSTRAINT: Grid for 6 boxes (3 cols x 2 rows) -->
        <div id="schedule-container" class="flex-1 grid grid-cols-3 grid-rows-2 gap-6 min-h-0">
            <div id="loading-state" class="col-span-3 row-span-2 flex flex-col items-center justify-center">
                 <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-500"></div>
                 <p class="mt-4 text-slate-400 text-lg">Connecting to live database...</p>
            </div>
        </div>
        
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCuo69DgYtxCdVRmRvziVfnS69koYMGJ0E",
            authDomain: "dashboard-1fb59.firebaseapp.com",
            projectId: "dashboard-1fb59",
            storageBucket: "dashboard-1fb59.firebasestorage.app",
            messagingSenderId: "576174466807",
            appId: "1:576174466807:web:eef62f64e35b69560815f2",
            measurementId: "G-213LH7WH40"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth Error:", error);
            }
        };

        initAuth();

        const formatDate = (dateString) => {
            if(!dateString) return 'N/A';
            const [year, month, day] = dateString.split('-').map(Number);
            const date = new Date(year, month - 1, day); 
            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            return date.toLocaleDateString(undefined, options);
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const scheduleRef = collection(db, 'artifacts', appId, 'public', 'data', 'emsSchedule');
                
                onSnapshot(scheduleRef, (snapshot) => {
                    const container = document.getElementById('schedule-container');
                    
                    // 1. Group shifts primarily by DATE
                    const groupedDates = {};
                    
                    // Calculate Today and Yesterday
                    const todayDate = new Date();
                    const todayStr = todayDate.toISOString().split('T')[0];
                    
                    const yesterdayDate = new Date(todayDate);
                    yesterdayDate.setDate(todayDate.getDate() - 1);
                    const yesterdayStr = yesterdayDate.toISOString().split('T')[0];

                    snapshot.forEach(doc => {
                        const d = doc.data();
                        
                        // Only process future/today shifts AND yesterday
                        if (d.date >= yesterdayStr) {
                            // If this date hasn't been seen, initialize it
                            if (!groupedDates[d.date]) {
                                groupedDates[d.date] = {
                                    date: d.date,
                                    shifts: {} // Will map Time -> Array of names
                                };
                            }
                            
                            const timeKey = d.time || 'Unspecified Time';
                            
                            // Initialize this specific time slot if needed
                            if (!groupedDates[d.date].shifts[timeKey]) {
                                groupedDates[d.date].shifts[timeKey] = [];
                            }

                            // Gather names for this specific entry
                            const names = [];
                            if (d.name) {
                                names.push(d.name);
                            } else {
                                // Fallback for old schema
                                if (d.crewMember1) names.push(d.crewMember1);
                                if (d.crewMember2) names.push(d.crewMember2);
                                if (d.trainee) names.push(`${d.trainee} (Trainee)`);
                            }
                            
                            // Add names to the time slot
                            groupedDates[d.date].shifts[timeKey].push(...names);
                        }
                    });

                    // 2. Convert Map to Array and Sort by Date
                    const displayDays = Object.values(groupedDates).sort((a, b) => {
                        return a.date.localeCompare(b.date);
                    });

                    // CONSTRAINT: Limit to 6 upcoming DAYS
                    const slicedDays = displayDays.slice(0, 6);

                    // Clear after logic to prevent flashing empty state if data exists
                    container.innerHTML = ''; 

                    if (slicedDays.length === 0) {
                         container.innerHTML = '<p class="col-span-3 row-span-2 flex items-center justify-center text-slate-400 text-2xl">No upcoming shifts scheduled.</p>';
                         return;
                    }

                    // 3. Render Cards
                    slicedDays.forEach(dayGroup => {
                        const isToday = dayGroup.date === todayStr;
                        const isYesterday = dayGroup.date === yesterdayStr;
                        
                        // Sort the time slots within this day (e.g. 06:00 before 18:00)
                        const sortedTimes = Object.keys(dayGroup.shifts).sort();

                        // Build HTML for the inner shift blocks
                        let shiftsHtml = '';
                        sortedTimes.forEach((time, index) => {
                            const crewNames = dayGroup.shifts[time].sort();
                            
                            shiftsHtml += `
                                <div class="${index > 0 ? 'mt-4 pt-3 border-t border-slate-700/50' : ''}">
                                    <div class="flex items-center mb-2">
                                        <!-- Increased font size to text-sm -->
                                        <div class="flex-shrink-0 flex items-center text-sm font-bold uppercase tracking-wider text-indigo-300 bg-indigo-900/30 px-2 py-0.5 rounded border border-indigo-500/30">
                                            <!-- Increased icon size to h-4 w-4 -->
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                            </svg>
                                            ${time}
                                        </div>
                                    </div>
                                    <div class="space-y-1">
                                        ${crewNames.map(name => `
                                            <div class="flex items-center text-slate-300">
                                                <!-- Increased icon size to h-5 w-5 -->
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-500 mr-2 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                                </svg>
                                                <!-- Increased text size to text-xl -->
                                                <span class="text-xl font-medium truncate">${name}</span>
                                            </div>
                                        `).join('')}
                                        ${crewNames.length === 0 ? '<span class="text-slate-500 italic text-sm pl-6">No crew assigned</span>' : ''}
                                    </div>
                                </div>
                            `;
                        });

                        const card = `
                            <div class="schedule-card h-full flex flex-col bg-slate-800/50 backdrop-blur-sm border border-slate-700 rounded-xl shadow-lg overflow-hidden ${isToday ? 'border-2 border-green-500 shadow-green-500/20' : ''} ${isYesterday ? 'border-2 border-orange-500/50 shadow-orange-500/10' : ''}">
                                <div class="p-5 flex-1 flex flex-col overflow-hidden">
                                    <div class="flex justify-between items-start mb-2 flex-shrink-0">
                                        <div>
                                            <!-- Increased date font size to text-3xl -->
                                            <p class="text-3xl font-bold text-white">${formatDate(dayGroup.date)}</p>
                                            <div class="flex gap-2">
                                                <!-- Increased tag font size to text-xs -->
                                                ${isToday ? '<span class="text-xs font-semibold inline-block px-2 py-0.5 uppercase rounded-full text-green-600 bg-green-200 mt-1">Today</span>' : ''}
                                                ${isYesterday ? '<span class="text-xs font-semibold inline-block px-2 py-0.5 uppercase rounded-full text-orange-600 bg-orange-200 mt-1">Yesterday</span>' : ''}
                                            </div>
                                        </div>
                                    </div>
                                    <div class="border-t border-slate-700 my-2 flex-shrink-0"></div>
                                    <div class="flex flex-col flex-1 overflow-y-auto no-scrollbar">
                                        ${shiftsHtml}
                                    </div>
                                </div>
                            </div>
                        `;
                        container.insertAdjacentHTML('beforeend', card);
                    });

                }, (error) => {
                    console.error("Data Listen Error:", error);
                    const container = document.getElementById('schedule-container');
                    container.innerHTML = '<div class="text-red-400 text-center col-span-full row-span-2 flex items-center justify-center text-2xl">Error loading schedule.</div>';
                });
            }
        });
    </script>
</body>
</html>
